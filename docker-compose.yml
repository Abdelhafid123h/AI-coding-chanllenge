version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./provided document:/app/docs
      - backend-data:/app/vector_store
    environment:
      - DOCS_PATH=/app/docs
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    networks:
      - rag-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - rag-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  backend-data:
